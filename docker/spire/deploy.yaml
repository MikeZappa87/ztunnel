# SPIRE deployment for ztunnel - replaces istiod CA
# This provides SPIFFE/SVID certificates to ztunnel via the Workload API
#
# Post-deploy: create registration entries for workload identities:
#   kubectl exec -n spire spire-server-0 -- /opt/spire/bin/spire-server entry create \
#     -spiffeID spiffe://cluster.local/ns/cluster-a/sa/default \
#     -parentID spiffe://cluster.local/agent \
#     -selector k8s:ns:cluster-a -selector k8s:sa:default
#
#   kubectl exec -n spire spire-server-0 -- /opt/spire/bin/spire-server entry create \
#     -spiffeID spiffe://cluster.local/ns/cluster-b/sa/default \
#     -parentID spiffe://cluster.local/agent \
#     -selector k8s:ns:cluster-b -selector k8s:sa:default

apiVersion: v1
kind: Namespace
metadata:
  name: spire
---
# SPIRE Server ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: spire
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "cluster.local"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
      
      ca_subject {
        country = ["US"]
        organization = ["SPIRE"]
        common_name = ""
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "ztunnel-test" = {
              service_account_allow_list = ["spire:spire-agent"]
            }
          }
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      UpstreamAuthority "disk" {
        plugin_data {
          key_file_path = "/run/spire/secrets/bootstrap.key"
          cert_file_path = "/run/spire/secrets/bootstrap.crt"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
# SPIRE Server Service
apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  type: ClusterIP
  selector:
    app: spire-server
  ports:
  - name: grpc
    port: 8081
    targetPort: 8081
---
# SPIRE Server ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: spire
---
# SPIRE Server ClusterRole - needs to validate tokens
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server
subjects:
- kind: ServiceAccount
  name: spire-server
  namespace: spire
---
